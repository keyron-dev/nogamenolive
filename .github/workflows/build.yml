name: Build ZMK Firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules
            tools
            zephyr
            bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}

      - name: Initialize workspace (west)
        uses: zmkfirmware/zmk/actions/setup@main

      - name: Build Left Hand
        uses: zmkfirmware/zmk/actions/build@main
        with:
          board: seeeduino_xiao_ble
          shield: ergonaut_one_left
          config_path: config

      - name: Build Right Hand
        uses: zmkfirmware/zmk/actions/build@main
        with:
          board: seeeduino_xiao_ble
          shield: ergonaut_one_right
          config_path: config

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ergonaut_one_firmware
          path: |
            build/artifacts/*.uf2
